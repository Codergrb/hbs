<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bill History — Hospital Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy: { DEFAULT: '#0F3D5C', dark: '#0A2C42' }, teal: { DEFAULT: '#0B7285', dark: '#086070' } },
    fontFamily: { sans: ['Poppins','system-ui','sans-serif'] },
  } } }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
<div id="nav"></div>

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex items-end justify-between flex-wrap gap-3 mb-6">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-navy-dark">Bill History</h1>
      <p class="text-slate-500 text-sm mt-1">All registered bills — records are read-only once saved</p>
    </div>
    <a href="new-bill.html" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-teal text-white text-sm font-semibold hover:bg-teal-dark transition shadow-sm">+ New Bill</a>
  </div>

  <div class="bg-white border border-amber-300 rounded-xl p-5 shadow-sm mb-5" id="dues-card">
    <h2 class="font-semibold text-lg text-amber-700 border-b border-slate-200 pb-3 mb-4">Outstanding Dues</h2>
    <div class="table-wrap">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs uppercase text-slate-500"><th class="pb-2">Bill No</th><th class="pb-2">Patient</th><th class="pb-2">Status</th><th class="pb-2 text-right">Due</th><th class="pb-2"></th></tr></thead>
        <tbody id="dues-body"></tbody>
      </table>
    </div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm mb-5">
    <div class="grid sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5" for="f-search">Search (bill no / patient)</label>
        <input id="f-search" placeholder="e.g. 2083HMS001 or Ramesh" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal focus:border-teal" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5" for="f-category">Category</label>
        <select id="f-category" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal focus:border-teal">
          <option value="">All</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5" for="f-doctor">Doctor</label>
        <select id="f-doctor" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal focus:border-teal"><option value="">All</option></select>
      </div>
    </div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
    <div class="table-wrap">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs uppercase text-slate-500">
          <th class="pb-2">Bill No</th><th class="pb-2">Date</th><th class="pb-2">Patient</th><th class="pb-2">Doctor</th><th class="pb-2">Category</th><th class="pb-2">Payment</th><th class="pb-2 text-right">Amount</th><th class="pb-2"></th>
        </tr></thead>
        <tbody id="history-body"><tr><td colspan="7" class="text-center text-slate-400 py-8">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/bill-history.js"></script>
</body>
</html>
