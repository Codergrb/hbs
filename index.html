<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Hospital Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy: { DEFAULT: '#0F3D5C', dark: '#0A2C42' }, teal: { DEFAULT: '#0B7285', dark: '#086070' } },
    fontFamily: { sans: ['Poppins','system-ui','sans-serif'] },
  } } }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
<div id="nav"></div>

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex items-end justify-between flex-wrap gap-3 mb-6">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-navy-dark">Dashboard</h1>
      <p class="text-slate-500 text-sm mt-1">Today's billing snapshot</p>
    </div>
    <a href="new-bill.html" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-teal text-white text-sm font-semibold hover:bg-teal-dark transition shadow-sm">+ New Bill</a>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
    <div class="bg-white border border-slate-200 border-l-4 border-l-teal rounded-xl p-4 shadow-sm">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Bills Today</div>
      <div class="text-2xl font-bold text-navy-dark mt-1" id="stat-bills-today">–</div>
    </div>
    <div class="bg-white border border-slate-200 border-l-4 border-l-teal rounded-xl p-4 shadow-sm">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Revenue Today</div>
      <div class="text-2xl font-bold text-navy-dark mt-1" id="stat-revenue-today">–</div>
    </div>
    <div class="bg-white border border-slate-200 border-l-4 border-l-teal rounded-xl p-4 shadow-sm">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Total Bills</div>
      <div class="text-2xl font-bold text-navy-dark mt-1" id="stat-bills-total">–</div>
    </div>
    <div class="bg-white border border-amber-300 border-l-4 border-l-amber-500 rounded-xl p-4 shadow-sm">
      <div class="text-xs font-semibold text-amber-700 uppercase tracking-wide">Outstanding Dues</div>
      <div class="text-2xl font-bold text-amber-700 mt-1" id="stat-dues">–</div>
    </div>
    <div class="bg-white border border-slate-200 border-l-4 border-l-teal rounded-xl p-4 shadow-sm">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Top Doctor</div>
      <div class="text-base font-bold text-navy-dark mt-1" id="stat-top-doctor">–</div>
    </div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm mb-6">
    <h2 class="font-semibold text-lg text-navy-dark border-b border-slate-200 pb-3 mb-4">Recent Bills</h2>
    <div class="table-wrap">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs uppercase text-slate-500">
          <th class="pb-2">Bill No</th><th class="pb-2">Date</th><th class="pb-2">Patient</th><th class="pb-2">Doctor</th><th class="pb-2">Category</th><th class="pb-2 text-right">Amount</th><th class="pb-2"></th>
        </tr></thead>
        <tbody id="recent-bills-body"><tr><td colspan="7" class="text-center text-slate-400 py-8">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
    <h2 class="font-semibold text-lg text-navy-dark border-b border-slate-200 pb-3 mb-4">Quick Links</h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <a href="new-bill.html" class="text-center px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm font-semibold hover:border-teal hover:text-teal transition bg-white">Generate a Bill</a>
      <a href="bill-history.html" class="text-center px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm font-semibold hover:border-teal hover:text-teal transition bg-white">Bill History</a>
      <a href="doctors.html" class="text-center px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm font-semibold hover:border-teal hover:text-teal transition bg-white">Doctor Performance</a>
      <a href="settings.html" class="text-center px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm font-semibold hover:border-teal hover:text-teal transition bg-white">Settings</a>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
